# SmartPlant — stack local de desarrollo.
#
# Levanta la infraestructura contra la que se desarrolla el backend:
#   db         Postgres 15 + TimescaleDB   :5432
#   minio      Object storage S3           :9000 (API) · :9001 (consola)
#   mosquitto  Broker MQTT                 :1883
#
# El ESQUEMA lo administra Alembic, NO este compose: aquí solo se levanta un
# Postgres vacío con la extensión de Timescale disponible. La primera migración
# crea las tablas y la hypertable (ver db/schema.sql como referencia del DDL).
#
# Los valores por defecto son de DESARROLLO. Para cualquier despliegue real,
# definirlos en un .env fuera del repositorio.

services:
  db:
    image: timescale/timescaledb:latest-pg15
    container_name: smartplant_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smartplant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartplant_secret}
      POSTGRES_DB: ${POSTGRES_DB:-smartplant_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smartplant} -d ${POSTGRES_DB:-smartplant_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: smartplant_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-admin123456}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # consola web

  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: smartplant_mqtt
    restart: unless-stopped
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    ports:
      - "1883:1883"
    # Sin mapeo de 9001: mosquitto.conf solo declara `listener 1883`.
    # Si se habilitan websockets, añadir el listener en mosquitto.conf y elegir
    # un puerto libre (9001 lo ocupa la consola de MinIO).

  # ---------------------------------------------------------------------------
  # Servicios pendientes de habilitar. Requieren archivos que aún no existen:
  #
  #   backend → un Dockerfile en esta carpeta y el código de la API
  #   caddy   → un Caddyfile con los dominios y el reverse proxy
  #
  # Se dejan comentados a propósito: `docker compose up` debe funcionar hoy.
  # ---------------------------------------------------------------------------

  # backend:
  #   build: .
  #   container_name: smartplant_api
  #   restart: unless-stopped
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #     mosquitto:
  #       condition: service_started
  #   environment:
  #     - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-smartplant}:${POSTGRES_PASSWORD:-smartplant_secret}@db:5432/${POSTGRES_DB:-smartplant_db}
  #     - MQTT_HOST=mosquitto
  #     - S3_ENDPOINT_URL=http://minio:9000
  #   ports:
  #     - "8000:8000"

  # caddy:
  #   image: caddy:latest
  #   container_name: smartplant_caddy
  #   restart: unless-stopped
  #   depends_on:
  #     - backend
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./Caddyfile:/etc/caddy/Caddyfile
  #     - caddy_data:/data
  #     - caddy_config:/config

volumes:
  postgres_data:
  minio_data:
  mosquitto_data:
  mosquitto_log:
  caddy_data:
  caddy_config:
