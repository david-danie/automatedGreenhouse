  #     - DATABASE_URL=postgresql://${POSTGRES_USER:-smartplant}:${POSTGRES_PASSWORD:-smartplant_secret}@db:5432/${POSTGRES_DB:-smartplant_db}
  #   ports:
  #     - "8000:8000"

volumes:
  postgres_data:
  minio_data:
  mosquitto_data:
  mosquitto_log:
  caddy_data:
  caddy_config:
